<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オーバーレイ制御 — SSL Auto Streamer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      overflow-y: auto;
      background: var(--md-sys-color-surface-dim);
      padding: 24px 16px;
    }
    .ctrl-panel {
      max-width: 540px;
      margin: 0 auto;
    }
    .ctrl-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .ctrl-header h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ctrl-header-icon {
      font-size: 24px;
      color: var(--md-sys-color-primary);
    }
    .ctrl-section {
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-xl);
      box-shadow: var(--md-sys-elevation-1);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .ctrl-section h3 {
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      padding: 12px 20px;
      background: var(--md-sys-color-surface-container-high);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ctrl-section h3 .material-symbols-rounded {
      font-size: 18px;
      color: var(--md-sys-color-primary);
    }
    .ctrl-section-body {
      padding: 14px 20px;
    }
    .ctrl-panel .toggle-row {
      font-size: 13px;
      padding: 12px 0;
    }
    .ticker-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ctrl-panel .overlay-link {
      display: inline-flex;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: var(--md-sys-shape-corner-full);
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
<div class="ctrl-panel">
  <div class="ctrl-header">
    <h2>
      <span class="material-symbols-rounded ctrl-header-icon">tune</span>
      <span>OBSオーバーレイ制御</span>
    </h2>
    <div id="ws-status-ctrl" class="status-pill">
      <div id="ws-dot-ctrl"></div>
      <span id="ws-label-ctrl">接続中...</span>
    </div>
  </div>

  <div class="ctrl-section">
    <h3><span class="material-symbols-rounded">link</span>リンク</h3>
    <div class="ctrl-section-body">
      <a class="overlay-link" id="overlay-link" href="/overlay" target="_blank">
        <span class="material-symbols-rounded">open_in_new</span>
        <span>/overlay — OBSブラウザソース用を開く</span>
      </a>
      <p style="font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-top:4px;">
        OBS → ソース追加 →「ブラウザ」→ URL に上記アドレスを設定してください。
      </p>
    </div>
  </div>

  <div class="ctrl-section">
    <h3><span class="material-symbols-rounded">tv</span>HUD 表示制御</h3>
    <div class="ctrl-section-body">
      <div class="toggle-row">
        <span>スコアバー表示</span>
        <label class="switch">
          <input type="checkbox" id="toggle-hud" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>効果音 (オーバーレイ側)</span>
        <label class="switch">
          <input type="checkbox" id="toggle-sound" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>実況音声 (OBS側)</span>
        <label class="switch">
          <input type="checkbox" id="toggle-output-audio" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <div class="ctrl-section">
    <h3><span class="material-symbols-rounded">subtitles</span>手動テロップ</h3>
    <div class="ctrl-section-body">
      <div class="ticker-form">
        <div class="ticker-input-wrapper">
          <span class="material-symbols-rounded ticker-icon">edit_note</span>
          <input type="text" id="ticker-text" placeholder="オーバーレイに表示するテキストを入力...">
        </div>
        <button class="btn btn-primary" id="send-ticker-btn">
          <span class="material-symbols-rounded">send</span>
          <span>テロップを送信 (5秒間表示)</span>
        </button>
      </div>
    </div>
  </div>

  <div class="ctrl-section">
    <h3><span class="material-symbols-rounded">layers</span>表示要素</h3>
    <div class="ctrl-section-body">
      <div class="toggle-row">
        <span>スタッツパネル</span>
        <label class="switch">
          <input type="checkbox" id="toggle-stats">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>フィールド</span>
        <label class="switch">
          <input type="checkbox" id="toggle-field">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>AI実況字幕</span>
        <label class="switch">
          <input type="checkbox" id="toggle-subtitles" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>ポゼッションバー</span>
        <label class="switch">
          <input type="checkbox" id="toggle-possession" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>ゴール演出エフェクト</span>
        <label class="switch">
          <input type="checkbox" id="toggle-celebration" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/ws-utils.js"></script>
<script src="/static/js/overlay-control.js"></script>
</body>
</html>
