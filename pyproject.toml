[project]
name = "ssl-auto-streamer"
version = "1.0.0"
description = "RoboCup SSL Auto Commentary System - Standalone"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "PyAudio>=0.2.13",
    "PyYAML>=6.0",
    "protobuf>=4.25",
    "aiohttp>=3.9",
    "pillow>=12.3.0",
]

[project.scripts]
ssl-auto-streamer = "ssl_auto_streamer.main:main"
ssl-log-player = "ssl_auto_streamer.tools.log_player:main"
ssl-log-cutter = "ssl_auto_streamer.tools.log_cutter:main"
ssl-log-generator = "ssl_auto_streamer.tools.log_generator:main"

[dependency-groups]
dev = ["grpcio-tools>=1.60", "ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ssl_auto_streamer"]

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_pytest -p no:launch-testing-ros"

[tool.ruff]
extend-exclude = ["ssl_auto_streamer/ssl/*_pb2.py"]
