analysis_agent:
  enabled: true
  max_output_tokens: 512
  model: gemini-3.5-flash-lite
  temperature: 0.7
  timeout_seconds: 5
ai_logger:
  enabled: true
  log_dir: logs/ai
  save_to_file: true
audio:
  device: ''
  output_mode: client
commentary:
  analyst_silence_threshold: 3
  barge_in: auto  # auto (Gemini 3.8 Live による自動判断) または rule_based (優先度閾値)
  interrupt_priority_threshold: 2
  mode: auto  # auto (Gemini 3.8 Live による自律解説) または reflex_analyst (固定ルール)
  writer_update_rate: 1
gemini:
  api_key: ''  # 環境変数 GEMINI_API_KEY を使用
  model: gemini-3.8-live
  thinking_model: gemini-3.8-live-extended-thinking
  output_transcription: true
  sample_rate: 24000
  thinking_level: medium
  visual_stream:
    enabled: true
    fps: 1.0
    width: 640
    height: 480
ssl:
  gc_addr: 224.5.23.1
  gc_ports:
  - 10003
  - 10003
  tracker_addr: 224.5.23.2
  tracker_ports:
  - 11010
  - 11010
  vision_addr: 224.5.23.1
  vision_ports:
  - 10006
  - 10006
